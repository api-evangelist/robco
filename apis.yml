aid: robco
name: Robco
description: RobCo is a Munich- and Austin-based industrial robotics company building software-defined,
  modular robotic automation delivered as Robotics-as-a-Service (RaaS) with zero upfront capital expenditure.
  Its modular robot arms (up to 8 axes, 40 kg payload, 2.5 m reach, 0.1 mm repeatability), the Alfie autonomous
  robot, the RobFlow no-code programming platform, RobCo Studio configuration and simulation tooling, and
  the RobVision AI vision system let manufacturers automate machine tending, palletizing, materials handling,
  and finishing tasks. RobCo serves manufacturing, food and beverage, logistics, automotive, wood, and
  defense customers, and is backed by Lightspeed, Sequoia Capital, Lingotto, Kindred Capital, and Promus Ventures.
